<!DOCTYPE html>
<html lang="en" data-theme="tactical">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#080a09">
    <title>Not found · O.A.S.I.S.</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23080a09'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%2358f5a5' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23f5a524'/%3E%3Cpath d='M32 4v10M32 50v10M4 32h10M50 32h10' stroke='%2358f5a5' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        .lost {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .lost h1 {
            font-size: clamp(2rem, 1.2rem + 3vw, 3rem);
            letter-spacing: .06em;
        }

        .lost .eyebrow {
            margin-bottom: 10px;
        }

        .lost p {
            color: var(--ink-dim);
            max-width: 56ch;
            margin: 12px auto 0;
        }
    </style>
</head>

<body>
    <main class="lost">
        <div>
            <p class="eyebrow">Error 404</p>
            <h1>No such page</h1>
            <p>That address does not exist here. Everything in this system lives under a single
                page, so a link that ends in <code>#/…</code> should still work — try the front door.</p>
            <div class="btn-row" style="justify-content:center">
                <a class="btn" href="/">Go to O.A.S.I.S.</a>
                <a class="btn ghost" href="/#/now">I need help now</a>
                <a class="btn ghost" href="/#/play">Playbooks</a>
            </div>
            <p style="margin-top:22px">Something missing or a link that should have worked?
                <a href="mailto:oasis@labidi.eu">oasis@labidi.eu</a>
            </p>
        </div>
    </main>
</body>

</html>
